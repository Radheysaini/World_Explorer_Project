<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore countries, flags, population and cultures around the world." />
    <title>World Explorer</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <script src="./script.js" defer></script>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen transition-colors duration-200">
    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
      <nav class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
        <a href="#" id="logoLink" class="text-xl font-bold text-blue-700">🌍 World Explorer</a>
        <div class="flex items-center gap-4 sm:gap-6">
          <a href="#explore" id="exploreLink" class="font-semibold text-blue-600 hover:text-blue-800">Explore</a>
        </div>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6">
      <section class="text-center pt-6 pb-5">
        <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">DISCOVER OUR PLANET</span>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mt-3">Explore the World</h1>
        <p class="text-slate-500 text-sm mt-2">Discover countries, cultures and beautiful places around the globe.</p>
      </section>
    </main>

    <footer class="bg-white border-t border-slate-200">
      <div class="max-w-7xl mx-auto px-6 py-6 text-center">
        <h3 class="font-bold text-blue-700">🌍 World Explorer</h3>
        <p class="text-slate-500 text-xs mt-2">Discover the world, one country at a time.</p>
        <p class="text-slate-400 text-xs mt-3">© 2026 World Explorer. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
